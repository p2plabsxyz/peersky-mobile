name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run runtime and bundle tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run live Holesail integration test
        run: npm run test:holesail:live

  peerchat-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The app's own PeerChat code on a thousand phones, connected in memory.
      # They take about 2.3 GB of JavaScript heap together, so the heap gets
      # room above that whatever the runner's default.
      - name: A thousand phones in one PeerChat room
        run: npm run test:scale:peerchat
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  android-content-blocking:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Rust Android tooling
        run: npm run setup:content-blocking

      - name: Fetch content-blocking snapshot
        run: npm run update:content-blocking-snapshot

      - name: Install Android NDK
        run: |
          # Gradle will download the NDK itself, but the archive sometimes
          # arrives truncated and the build dies with "Archive is not a ZIP
          # archive". Install it up front with sdkmanager, which verifies what
          # it fetches, and read the version from Expo so this keeps following
          # an SDK bump instead of drifting.
          plugin='node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-plugin/src/main/kotlin/expo/modules/plugin/ExpoRootProjectPlugin.kt'
          ndk_version="$(grep -oE '"ndkVersion", "[0-9.]+"' "$plugin" | grep -oE '[0-9]+(\.[0-9]+)+')"
          if [ -z "$ndk_version" ]; then
            echo "Could not read ndkVersion from $plugin" >&2
            exit 1
          fi
          echo "Installing NDK $ndk_version"
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version"; then
              exit 0
            fi
            echo "sdkmanager attempt $attempt failed, retrying"
            sleep 15
          done
          echo "NDK install failed after 3 attempts" >&2
          exit 1

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android native integration
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin

  ios-content-blocking:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install dependencies
        run: npm ci

      - name: Bundle Bare runtime
        run: npm run bundle:bare

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install iOS pods
        working-directory: ios
        run: pod install

      - name: Compile iOS native integration
        working-directory: ios
        run: |
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          set +e
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E '(^|[[:space:]])error:|The following build commands failed' xcodebuild.log \
              | tail -n 20 \
              | while IFS= read -r line; do
                  line=${line//'%'/'%25'}
                  line=${line//$'\r'/'%0D'}
                  line=${line//$'\n'/'%0A'}
                  echo "::error::$line"
                done
          fi
          exit "$status"
